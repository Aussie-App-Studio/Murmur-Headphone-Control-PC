[package]
name = "murmur-pc"
version = "1.0.0"
edition = "2021"
description = "Murmur — Offline Headphone Control for PC"

[[bin]]
name = "murmur"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
bytemuck = "1"
eframe = "0.31"
egui = "0.31"
egui_glow = "0.31"
glow = "0.16"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
directories = "5"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
tray-icon = "0.19"
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Foundation",
    "Foundation_Collections",
    "Devices_Bluetooth_Advertisement",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Devices_Bluetooth",
    "Win32_System_Registry",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
panic = "abort"
